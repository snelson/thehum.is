<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Nothing. Something. No thing, some thing. The original beat. Became sound. Light. Form.">
<meta name="theme-color" content="#0b0a14">
<link rel="canonical" href="https://thehum.is/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="The Hum">
<meta property="og:description" content="Everything is this. Still enough to hear that it becomes through us.">
<meta property="og:url" content="https://thehum.is/">
<title>The Hum</title>
<script>try { if (!localStorage.getItem('hum.entered') && !localStorage.getItem('hum.heard')) document.documentElement.classList.add('entering'); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..400;1,6..72,300&display=swap" rel="stylesheet">
<style>
  /* One dark theme, on purpose. The sister page radiates; this one draws in. */
  :root {
    color-scheme: dark;
    --field: #0b0a14;
    --corner: #060510;
    --ink: #e6e2f0;
    --ink-dim: #8f87b0;
    --ring: #b48cff;
    --magenta: #ff5fb8;
    --teal: #4fd6c8;
    /* Void diameter. Desktop: fixed. Phone: wider than the screen, so the
       ring reads as a horizon, not a badge. Cap keeps the verse inside. */
    --d: 560px;
    --inscription-size: 11px;
    --verse-size: 22px;
    --verse-lh: 1.6;
    --verse-w: min(80vw, 420px);
    --footer-h: 44px;
    --footer-gap: 28px;
    /* The reset's draw-in: the verse falls into the void, faster and faster all the way to the centre
       (ease-in cubic), fading on the same curve. It goes first; the void follows DRAWIN_LEAD later. */
    --draw-in-ease: cubic-bezier(0.32, 0, 0.67, 0);
    --draw-in-fade: var(--draw-in-ease);
    --draw-in-time: 1.1s;
    /* The name's return: how far it rises into place and over how long (the fade lands a little sooner). */
    --head-rise: 28px;
    --head-rise-time: 1.8s;
  }
  @media (max-width: 700px) {
    :root {
      --d: clamp(560px, 150vw, 720px);
      --inscription-size: 10px;
      --verse-size: 18px;
      --verse-lh: 1.55;
      --verse-w: 80vw;
    }
  }

  html { background: var(--corner); }
  body {
    margin: 0;
    min-height: 100svh;
    position: relative;
    color: var(--ink);
    background: var(--field);
    /* Vignette only. No other gradient belongs here. */
    background-image: radial-gradient(ellipse 80% 80% at 50% 50%, var(--field) 55%, var(--corner) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* The stage is pinned to the viewport: the void's center is the viewport's. */
  .stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  /* Flat interior. Nothing animated crosses it; the canvas only paints outside r. */
  .void {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--d);
    height: var(--d);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    /* Depth without motion: just off the field at the rim, near-black at the center. A hole that recedes. */
    background: radial-gradient(circle closest-side, #040309 0%, #06050d 45%, #0a0915 82%, #0d0b18 100%);
  }
  /* The name frames the page from the top edge, as the link does from the bottom. */
  .head {
    position: absolute; left: 0; right: 0; top: 0; z-index: 2; margin: 0; /* above the verse flow, so the switch takes the tap */
    padding-top: calc(var(--footer-gap) + 14px + env(safe-area-inset-top, 0px));
    display: flex; flex-direction: column; align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500; font-size: var(--inscription-size);
    letter-spacing: 0.38em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  /* The name is also the switch. Same look as before; the tap target grows
     downward into the dark so the text doesn't move. */
  .hum-toggle {
    appearance: none; -webkit-appearance: none;
    background: none; border: 0; margin: 0; box-sizing: border-box;
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
    opacity: 0.75;
    display: inline-flex; align-items: flex-start;
    min-width: 44px; min-height: 44px; line-height: 13px;
    /* left pad balances the trailing tracking, so THE HUM stays centered */
    padding: 0 0 31px 0.38em;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: opacity 300ms ease;
  }
  .hum-toggle:hover { opacity: 0.95; }
  .hum-toggle:focus { outline: none; }
  .hum-toggle:focus-visible .hum-text {
    outline: 1px solid rgba(180,140,255,0.6); outline-offset: 5px; border-radius: 2px;
  }
  /* On: the words themselves hum — brighter, with a soft glow that swells and settles every 2 s. */
  .hum-text { transition: color 2s ease, text-shadow 2s ease; }
  .hum-toggle[aria-pressed="true"] { opacity: 0.95; }
  .hum-toggle[aria-pressed="true"] .hum-text {
    color: #cfc6ee;
    animation: hum-pulse 2s ease-in-out 1.5s infinite;
  }
  @keyframes hum-pulse {
    0%, 100% { color: #b9b0da; text-shadow: 0 0 4px rgba(180,140,255,0.15); }
    50% { color: #ece6ff; text-shadow: 0 0 9px rgba(180,140,255,0.55); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hum-toggle[aria-pressed="true"] .hum-text { animation: none; }
  }
  .hum-hint {
    margin-top: -22px;
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 300;
    font-size: 11px; letter-spacing: 0.02em; text-transform: none;
    color: var(--ink-dim); opacity: 0.45;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }
  .hum-hint.fade { opacity: 0; }

  /* First visit: the void starts closed, a third of its size, with the name in it.
     Tapping it is the way in. Without JS, or once entered, none of this shows.
     The reset under the links plays it backwards, back to this door. */
  .door { display: none; }
  .entering .door, .opening .door { display: block; position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .entering .void { transform: translate(-50%, -50%) scale(0.3333); }
  .entering .head { opacity: 0; visibility: hidden; }
  .entering .verse p > span { opacity: 0; }   /* hidden to the eye only; still read */
  .door-in {
    appearance: none; -webkit-appearance: none;
    background: none; border: 0; margin: 0; padding: 0;
    position: absolute; left: 50%; top: 50%;
    width: calc(var(--d) / 3); height: calc(var(--d) / 3);
    transform: translate(-50%, -50%); border-radius: 50%;
    display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500; font-size: var(--inscription-size);
    letter-spacing: 0.38em; text-transform: uppercase;
    color: var(--ink-dim);
    cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .door-name { display: flex; flex-direction: column; align-items: center; opacity: 0.75; transition: opacity 300ms ease; }
  .door-word { padding-left: 0.38em; }   /* balances the trailing tracking, as in the header */
  .door-hint {
    margin-top: 9px;
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 300;
    font-size: 11px; letter-spacing: 0.02em; text-transform: none;
    opacity: 0.6;   /* inside the name's 0.75: the header hint's 0.45 */
  }
  .door-in:hover .door-name { opacity: 0.95; }
  .door-in:focus, .door-quiet:focus { outline: none; }
  .door-in:focus-visible .door-name, .door-quiet:focus-visible {
    outline: 1px solid rgba(180,140,255,0.6); outline-offset: 5px; border-radius: 2px;
  }
  .door-ways {
    position: absolute; left: 0; right: 0; top: calc(50% + var(--d) / 6 + 36px);
    display: flex; flex-direction: column; align-items: center;
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 300;
    letter-spacing: 0.02em; color: var(--ink-dim);
  }
  .door-quiet {
    appearance: none; -webkit-appearance: none; background: none; border: 0; margin: 0; padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center;
    font: inherit; font-size: 10px; letter-spacing: inherit; color: inherit;
    min-height: 44px; opacity: 0.28; transition: opacity 300ms ease;
    cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .door-quiet:hover { opacity: 0.5; }
  .arriving .door-in, .arriving .door-ways { animation: appear 1.2s ease both; }
  @keyframes appear { from { opacity: 0; } }
  /* The tap: the void opens (drawn by the canvas, 2.4 s) and the name is pulled in as it goes,
     gone by the middle; the name lands at the top as the void settles, then the verse a line at a time. */
  @media (prefers-reduced-motion: no-preference) {
    .opening .door-in .door-name {   /* outranks :hover, which the tapping pointer is still on */
      opacity: 0; transform: scale(0.2);
      transition: all 1.2s cubic-bezier(0.55, 0, 1, 0.45);   /* falling: slow, then all at once */
    }
    .opening .door-word { letter-spacing: 0; padding-left: 0; transition: all 1.2s cubic-bezier(0.55, 0, 1, 0.45); }
    .opening .door-ways { opacity: 0; transition: opacity 0.6s ease; }
    .opening .head { transition: opacity 0.9s ease 1.9s, visibility 0s linear 1.9s; }
    /* The verse at reading pace, laid out at its final size from the start. From its PACE time each
       line's letters stream in one by one (.ch.on, each fading 0.4 s), and the letters (.ink) slide by
       half of what's still to come, so the line widens from the middle. "Nothing." arrives at the centre
       and holds; then the whole verse slowly follows what's visible (the script's follow), landing in
       place as the void reaches full. A pause, then the name comes back at the top (.landed),
       then the end mark. A skip shows the rest, the void and the name together. */
    .pacing .verse .ink { display: inline-block; transition: transform 0.04s ease-out; }
    .pacing .verse .ch { opacity: 0; transition: opacity 0.4s ease; }
    .pacing .verse .ch.on { opacity: 1; }
    .pacing.skipped .verse .ink { transition: transform 0.6s ease-in-out; }
    /* The name surfaces: it rises --head-rise into place over --head-rise-time, decelerating, solid before it
       settles; it sinks back the same distance on the reset. */
    .pacing .head {
      opacity: 0; visibility: hidden; transform: translateY(var(--head-rise));
      transition: opacity 0.6s ease, transform 0.6s ease, visibility 0s linear 0.6s;
    }
    .pacing.landed .head {
      opacity: 1; visibility: visible; transform: none;
      transition: opacity calc(var(--head-rise-time) * 0.75) ease, transform var(--head-rise-time) cubic-bezier(0.33, 1, 0.68, 1), visibility 0s;
    }
    .pacing.skipped.landed .head { transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.33, 1, 0.68, 1), visibility 0s; }
    /* Backwards: the end mark goes, the name sinks, and the verse is drawn into the void's centre the way
       the name is on the way in (--draw-in-ease, --draw-in-time), as the void closes around it. */
    .leaving .verse-wrap {
      opacity: 0; transform: scale(0.2); transform-origin: 50% 50vh;
      transition: transform var(--draw-in-time) var(--draw-in-ease), opacity var(--draw-in-time) var(--draw-in-fade);   /* at once; the void follows DRAWIN_LEAD later */
    }
    .leaving .head, .leaving.pacing.landed .head {
      opacity: 0; visibility: hidden; transform: translateY(var(--head-rise));
      transition: opacity 0.6s ease 0.2s, transform 0.8s cubic-bezier(0.7, 0, 0.84, 0) 0.2s, visibility 0s linear 1s;
    }
  }
  /* Reduced motion: no pull, no opening. The door fades out, the page fades in. */
  @media (prefers-reduced-motion: reduce) {
    .opening .door { opacity: 0; transition: opacity 0.6s ease; }
    .opening .stage { transition: opacity 0.6s ease; }
    .opening.dark .stage { opacity: 0; }
    .opening .head { transition: opacity 0.8s ease 0.3s, visibility 0s linear 0.3s; }
    .opening .verse p > span { transition: opacity 0.8s ease 0.3s; }
    .leaving .head { opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0s linear 0.6s; }
    .leaving .verse p > span { opacity: 0; transition: opacity 0.6s ease; }
    .leaving .stage, .arriving .stage { transition: opacity 0.6s ease; }
    .leaving.dark .stage { opacity: 0; }
  }

  /* Verse sits in flow so a short viewport scrolls instead of clipping.
     Symmetric padding keeps it on the viewport center when it fits; the
     bottom pad also reserves the footer's room. */
  .verse-wrap {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    box-sizing: border-box;
    padding: 84px 0 calc(84px + env(safe-area-inset-bottom, 0px));
    display: grid;
    place-items: center;
  }
  .verse {
    width: var(--verse-w);
    margin: 0;
    text-align: center;
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-weight: 340;   /* light text on the dark reads thinner than it is */
    font-size: var(--verse-size);
    line-height: var(--verse-lh);
    color: rgb(216 208 244 / 0.95);   /* the hum's own lavender, a step brighter (the playing name's #cfc6ee), so the words share its light */
  }
  .verse p { margin: 0; }
  .verse p + p { margin-top: calc(var(--verse-size) * var(--verse-lh) * 1.25); }   /* a breath, not a skipped line */
  .verse p > span {
    display: block;
    text-wrap: balance;
  }
  .verse .sr {   /* a streaming line's whole text, for screen readers; the letters are aria-hidden */
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  .foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    padding-bottom: calc(var(--footer-gap) + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }
  .foot a {
    display: inline-flex;
    align-items: center;
    min-height: var(--footer-h);
    padding: 0 12px;
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: 14px;
    color: var(--ink-dim);
    opacity: 0.75;
    text-decoration: none;
    transition: color 300ms ease, opacity 300ms ease;
  }
  .foot a:hover, .foot a:focus-visible {
    color: var(--ink);
    opacity: 1;
    outline: none;
  }
  /* Reset: a small turning arrow under the verse, its end mark, easy to miss. Brings the entrance back.
     It hangs below the verse without taking room, so the verse's centring is the verse's alone. */
  .verse { position: relative; }
  .verse-reset {
    appearance: none; -webkit-appearance: none; background: none; border: 0; margin: 0; padding: 0;
    position: absolute; left: 50%; top: calc(100% + var(--verse-size) * var(--verse-lh) * 0.7 - 17px); transform: translateX(-50%);
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); opacity: 0.38; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: color 300ms ease, opacity 300ms ease;
  }
  .verse-reset:hover, .verse-reset:focus-visible { opacity: 0.75; outline: none; }
  .verse-reset svg { display: block; width: 10px; height: 10px; }
  /* Hidden at the door, while the entrance runs (.quiet-mark: until 1.5 s after the void is full), and
     first to go on the reset. It arrives slowly (.mark-in), the last thing. */
  .entering .verse-reset, .opening .verse-reset, .quiet-mark .verse-reset { visibility: hidden; opacity: 0; }
  .leaving .verse-reset { visibility: hidden; opacity: 0; transition: opacity 0.25s ease, visibility 0s linear 0.25s; }
  .mark-in .verse-reset { transition: opacity 1.5s ease; }
  /* After the tap that enters, the mouse pointer goes quiet until it moves. */
  html.cursor-hidden, html.cursor-hidden * { cursor: none !important; }
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <canvas id="field"></canvas>
  <div class="void"></div>
</div>

<div class="door">
  <button type="button" class="door-in" aria-label="The Hum. Tap to hear"><span class="door-name"><span class="door-word">The Hum</span><span class="door-hint">tap to hear</span></span></button>
  <div class="door-ways">
    <button type="button" class="door-quiet" aria-label="Enter silently">or silently</button>
  </div>
</div>

<h1 class="head">
  <button type="button" class="hum-toggle" id="hum" aria-pressed="false" aria-label="Turn the hum on"><span class="hum-text">The Hum</span></button>
  <span class="hum-hint" id="hum-hint" aria-hidden="true" hidden>tap to hear</span>
</h1>

<main class="verse-wrap">
  <div class="verse">
    <p>
      <span><span>Nothing.</span></span>
      <span><span>Something.</span></span>
      <span><span>No thing, some thing.</span></span>
      <span><span>The original beat.</span></span>
      <span><span>Became sound.</span></span>
      <span><span>Light.</span></span>
      <span><span>Form.</span></span>
    </p>
    <p>
      <span><span>Everything is this.</span></span>
      <span><span>Still enough to hear</span></span>
      <span><span>that it becomes</span></span>
      <span><span>through us.</span></span>
    </p>
    <button type="button" class="verse-reset" aria-label="See the entrance again"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.2 1.6v2.8H9.4"/></svg></button>
  </div>
</main>

<footer class="foot">
  <a href="https://thehum.studio" aria-label="thehum.studio">studio</a>
  <a href="https://thehum.works" aria-label="thehum.works">works</a>
</footer>

<script>
(() => {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const voidEl = document.querySelector('.void');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const RING = '#b48cff', MAGENTA = '#ff5fb8', TEAL = '#4fd6c8';
  const TAU = Math.PI * 2;

  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, r = 280, r0 = 280, maxR = 0, lastScale = 1;
  let glow = null;      // cached outer glow, drawn once per resize
  let ringGrad = null;  // cached conic tint
  let points = [];
  // The aperture: how open the void is, 1/3 at the door, 1 once entered. swing() eases it between:
  // by default the long door swing (a held start, a rush, a long settle: quintic in-out, 2.4 s).
  const SHUT = 1 / 3, SWING_MS = 2400;
  const quint = (p) => p < 0.5 ? 16 * p ** 5 : 1 - (2 - 2 * p) ** 5 / 2;
  // A CSS cubic-bezier as a function of progress, so a swing can ride the same curve as a transition.
  const bezier = (x1, y1, x2, y2) => (x) => {
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 24; i++) { t = (lo + hi) / 2; if (3 * (1 - t) ** 2 * t * x1 + 3 * (1 - t) * t * t * x2 + t ** 3 < x) lo = t; else hi = t; }
    return 3 * (1 - t) ** 2 * t * y1 + 3 * (1 - t) * t * t * y2 + t ** 3;
  };
  let aperture = document.documentElement.classList.contains('entering') ? SHUT : 1, apFrom = aperture, apTo = aperture, apAt = 0, apMs = SWING_MS, apEase = quint;
  const swing = (to, at, ms = SWING_MS, ease = quint) => { apFrom = aperture; apTo = to; apAt = at; apMs = ms; apEase = ease; };
  // The reset's close: ease-in-out expo, from where it is to exactly the door's size over CLOSE_MS,
  // starting DRAWIN_LEAD s after the verse's draw-in.
  const CLOSE_MS = 2000, DRAWIN_LEAD = 0.3;
  const expoInOut = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2);

  const mix = (a, b, t) => {
    const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
    return pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  // Far points are dim and cool; near the ring they warm toward the ring itself.
  const FAR = mix('#5e5484', TEAL, 0.35);
  const NEAR = mix(RING, MAGENTA, 0.25);

  function layout() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2;
    r0 = voidEl.offsetWidth / 2;   // layout size, unaffected by the pulse's scale or the aperture
    r = r0 * aperture;
    maxR = Math.hypot(W, H) / 2;

    // Glow: outside the ring only, so the interior stays flat.
    const gs = Math.ceil((r0 + 24) * 2), g = document.createElement('canvas');
    g.width = g.height = Math.round(gs * dpr);
    const gc = g.getContext('2d'); gc.scale(dpr, dpr);
    const grad = gc.createRadialGradient(gs / 2, gs / 2, 0, gs / 2, gs / 2, r0 + 18);
    const e = r0 / (r0 + 18);
    grad.addColorStop(0, 'rgba(180,140,255,0)');
    grad.addColorStop(e, 'rgba(180,140,255,0)');
    grad.addColorStop(e + 0.0001, 'rgba(180,140,255,0.22)');
    grad.addColorStop(e + (1 - e) * 0.35, 'rgba(180,140,255,0.07)');
    grad.addColorStop(1, 'rgba(180,140,255,0)');
    gc.fillStyle = grad; gc.fillRect(0, 0, gs, gs);
    glow = { c: g, s: gs };

    // Ring tint: magenta near 11 o'clock, teal near 5. Narrow, faint.
    if (ctx.createConicGradient) {
      ringGrad = ctx.createConicGradient(0, cx, cy);
      const m = rgba(mix(RING, MAGENTA, 0.5), 1), t = rgba(mix(RING, TEAL, 0.5), 1);
      [[0, RING], [0.10, RING], [0.1667, t], [0.24, RING], [0.60, RING], [0.6667, m], [0.73, RING], [1, RING]]
        .forEach(([s, col]) => ringGrad.addColorStop(s, col));
    } else ringGrad = RING;

      scheduleDetune(); scheduleGlide(settled - actx.currentTime); scheduleColour(); scheduleBreath(); scheduleVibrato(); scheduleStrings(); scheduleTremolo(); scheduleKey(true);
    }
    fadeIn(LEVEL, secs);
    if (debug) window.__hum = { ctx: actx, master: graph.master, graph };
  }
  function disable() {
    if (!graph) return;
    ramp(0, 2);
    tearDown = setTimeout(() => { if (!on && graph) destroy(); }, 2400);
  }

  btn.addEventListener('click', () => {
    on = !on;
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? 'Turn the hum off' : 'Turn the hum on');
    clearTimeout(hintTimer);
    if (on) {
      enable(); remember();
      hint.classList.add('fade'); hintTimer = setTimeout(() => { hint.hidden = true; }, 1700);
    } else {
      disable();
      hint.hidden = false; void hint.offsetWidth; hint.classList.remove('fade');   // unhide, then fade back in
    }
  });
  // ---- The way in ------------------------------------------------------------
  // The circle enters with the hum on, through the header's own switch; "silently" enters with
  // it off. Either way the entrance is remembered. The reset under the links runs it backwards.
  const root = document.documentElement, door = document.querySelector('.door'), reset = document.querySelector('.verse-reset');
  const lines = document.querySelectorAll('.verse p > span');
  // The verse at reading pace, on the entrance only. Each number is the pause, in seconds, before
  // its line starts to fade in; the first counts from the tap. Tune by ear.
  const PACE = [
    2.4,   // Nothing.                          as the void settles
    1.5,   // Something.
    1.7,   // No thing, some thing.             a little room
    2.2,   // The original beat.                its own breath (room after the long comma above)
    2.1,   // Became sound.                     a held beat after the origin, then the change
    1.8,   // Light.                            held
    1.9,   // Form.                             held
    2.6,   // Everything is this.               held after "Form.", a breath at the stanza break
    1.8,   // Still enough to hear              its own breath
    1.4,   // that it becomes                   close behind: one sentence across the lines
    2.6,   // through us.                       held: the arrival (~23 s)
  ];
  // A comma's beat inside a line, where it differs from COMMA_MS (ms, by line index). Tune by ear.
  const COMMA_BEAT = {
    2: 600,   // No thing, | some thing.
  };
  const landing = () => PACE.reduce((a, p) => a + p, 0) + FADE;   // the void full, the verse landed: s after the tap
  const FADE = 1.2;   // a line's arrival: its row opens (0.9 s) and its letters stream and fade in
  // Within a line: a beat per letter (spaces too), a longer one after a comma or a full stop.
  const LETTER_MS = 50, COMMA_MS = 150, STOP_MS = 250;
  const beat = (c, n) => LETTER_MS + (c === ',' ? (COMMA_BEAT[n] ?? COMMA_MS) : c === '.' ? STOP_MS : 0);
  // The void grows with the verse: from the tap, one slow curve from the door's third to full, landing
  // as the last line finishes its fade (so retuning PACE moves it too). Quick enough at first to hold
  // "Nothing." with room, steady through the middle, a soft settle; it stays ahead of the opening rows.
  const GROW_EASE = bezier(0.2, 0.25, 0.6, 1);
  const SKIP_MS = 800, SKIP_EASE = bezier(0.42, 0, 0.58, 1);   // a skip: the rows' ease-in-out
  let paceTimers = [], armed = false, swallow = false, swallowTimer = 0, refocus = false;
  // While pacing, each line is letters for the eye (aria-hidden) and its whole text for the ear.
  // Measured once, at the start: the line's width and how far each letter reaches, so the
  // letters can sit where they end up and slide by half of what's still to come.
  const texts = [...lines].map((l) => l.firstElementChild.textContent);
  let streams = [];
  function split() {
    streams = [...lines].map((l, n) => {
      const box = l.firstElementChild, text = texts[n];
      const sr = document.createElement('span'), ink = document.createElement('span');
      sr.className = 'sr'; sr.textContent = text;
      ink.className = 'ink'; ink.setAttribute('aria-hidden', 'true');
      const chs = [...text].map((c) => { const ch = document.createElement('span'); ch.className = 'ch'; ch.textContent = c; return ch; });
      ink.append(...chs); box.replaceChildren(sr, ink);
      const r = ink.getBoundingClientRect();
      let reach = 0;   // a space reaches no further than the letter before it
      const ends = chs.map((ch, i) => (text[i] === ' ' ? reach : (reach = ch.getBoundingClientRect().right - r.left)));
      ink.style.transform = `translateX(${r.width / 2}px)`;
      return { ink, chs, ends, w: r.width, text };
    });
  }
  function unsplit() { lines.forEach((l, n) => { l.firstElementChild.textContent = texts[n]; }); streams = []; }
  function stream(n) {
    const { ink, chs, ends, w, text } = streams[n];
    let t = 0;
    chs.forEach((ch, i) => {
      paceTimers.push(setTimeout(() => { ch.classList.add('on'); ink.style.transform = `translateX(${(w - ends[i]) / 2}px)`; }, t));
      t += beat(text[i], n);
    });
  }
  // The drift: the verse keeps what's visible close to the centre. "Nothing." arrives at the centre and
  // holds. Each later line's place is made ahead of it: from LEAD s before it starts (never before the
  // line above has begun its last letter) the verse glides to centre the lines with it, pre-shifting at
  // most half a line, so what's visible stays within half a line of the centre and a line usually streams
  // into place without moving. A bigger step (the stanza gap) finishes over POST s as its line streams.
  // A light critically damped follow (SMOOTH s) rounds the joins; no overshoot. Whatever's left after the
  // last line starts eases out, so the verse lands in place as the void reaches full.
  const LEAD = 0.9, POST = 0.6, SMOOTH = 0.12;
  const lastLetter = (n) => [...texts[n]].slice(0, -1).reduce((a, c) => a + beat(c, n), 0) / 1000;
  const rowsNow = () => [...lines].map((l) => { const r = l.getBoundingClientRect(); return [r.top - flowY, r.bottom - flowY]; });
  const centring = (rows, k) => innerHeight / 2 - (rows[0][0] + rows[k][1]) / 2;
  const smooth = (p) => { p = Math.min(1, Math.max(0, p)); return p * p * (3 - 2 * p); };
  function follow(t0, end) {
    const rows = rowsNow(), half = (rows[0][1] - rows[0][0]) / 2;
    const starts = PACE.map((p, i) => PACE.slice(0, i + 1).reduce((a, b) => a + b, 0));
    const leads = starts.map((s0, i) => (i ? s0 - Math.min(LEAD, s0 - starts[i - 1] - lastLetter(i - 1)) : s0));
    const c = starts.map((s0, k) => centring(rows, k));
    const pre = c.map((ck, k) => (k ? Math.max(-half, Math.min(half, ck - c[k - 1])) : 0));   // the part made ahead
    const lastAt = starts[starts.length - 1], w = 1 / SMOOTH;
    const target = (t) => {
      let k = 0; while (k + 1 < starts.length && t >= starts[k + 1]) k++;
      const n = k + 1;
      if (n < starts.length && t >= leads[n]) return c[k] + pre[n] * smooth((t - leads[n]) / (starts[n] - 0.15 - leads[n]));   // made just before it starts
      if (k && t < starts[k] + POST) return c[k - 1] + pre[k] + (c[k] - c[k - 1] - pre[k]) * smooth((t - starts[k]) / POST);
      return c[k];
    };
    let x = c[0], v = 0;
    return { at(now, dt) {
      const t = (now - t0) / 1000;
      if (t < leads[1]) return x;
      v += (w * w * (target(t) - x) - 2 * w * v) * dt; x += v * dt;
      const e = t <= lastAt ? 0 : Math.min(1, (t - lastAt) / (end - lastAt));
      return x * (1 - e * e * (3 - 2 * e));
    } };
  }
  // A skip: from wherever the verse is to `to`, on the void's own way from here to `apTo`.
  function tie(to, apTo) {
    const from = flowY, ap0 = aperture;
    return { at() { const f = apTo === ap0 ? 1 : Math.min(1, Math.max(0, (aperture - ap0) / (apTo - ap0))); return from + (to - from) * f; } };
  }
  function halt() { paceTimers.forEach(clearTimeout); paceTimers = []; armed = false; }
  function unpace() {
    halt();
    root.classList.remove('pacing', 'skipped', 'landed');
    flow = null; flowY = 0; verseEl.style.transform = '';
    unsplit();
  }
  // The close: once the last line has landed and the void is full, a pause (HEAD_PAUSE s), then the name
  // rises in at the top (HEAD_RISE s, as .landed in the CSS), then the end mark (the reset) fades in
  // MARK_AFTER s after the name has landed. A skip runs it without the pause.
  const HEAD_PAUSE = 1.2, HEAD_RISE = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--head-rise-time')) || 1.8, MARK_AFTER = 1.0;
  let markTimer = 0;
  function markLater(secs) {
    clearTimeout(markTimer);
    markTimer = setTimeout(() => {
      root.classList.add('mark-in'); root.classList.remove('quiet-mark');
      markTimer = setTimeout(() => root.classList.remove('mark-in'), 1600);
    }, secs * 1000);
  }
  function land() {   // the name comes back at the top
    root.classList.add('landed');
    if (refocus) { refocus = false; btn.focus({ preventScroll: true }); }
  }
  function pace() {
    const end = landing();
    root.classList.add('pacing');
    split();   // after .pacing, so the letters are born hidden (no fade-out from a first, plain style)
    flow = follow(performance.now(), end);
    swing(1, performance.now(), end * 1000, GROW_EASE);
    let at = 0;
    lines.forEach((l, i) => {
      at += PACE[i] || 0;
      paceTimers.push(setTimeout(() => { armed = true; stream(i); }, at * 1000));
    });
    const landed = Math.max(end, at + lastLetter(lines.length - 1) + 0.4), named = landed + HEAD_PAUSE;
    paceTimers.push(setTimeout(land, named * 1000));
    root.classList.add('quiet-mark'); markLater(named + HEAD_RISE + MARK_AFTER);
    paceTimers.push(setTimeout(unpace, (named + HEAD_RISE + 0.2) * 1000));
  }
  // Never trap a reader: once the first line is up, a tap, scroll, wheel or key shows the rest.
  function skip() {
    if (!armed) return false;
    armed = false;
    halt();
    root.classList.add('skipped');
    for (const { ink, chs } of streams) {   // the streaming line glides to rest; lines yet to come just appear there
      if (!chs[0].classList.contains('on')) ink.style.transition = 'none';
      chs.forEach((ch) => ch.classList.add('on')); ink.style.transform = '';
    }
    flow = tie(0, 1);
    markLater(SKIP_MS / 1000 + MARK_AFTER);   // the name rises over the skip's 0.8 s (CSS), then the mark
    land(); swing(1, performance.now(), SKIP_MS, SKIP_EASE);   // with the void to full and the name back
    paceTimers = [setTimeout(unpace, FADE * 1000)];   // lets any line mid-fade finish its own
    return true;
  }
  // The tap that skips is spent on it: it doesn't also flip the hum or follow a link. Same for
  // Enter or Space on a focused control. The reset is left alone; it takes the verse down itself.
  addEventListener('pointerdown', (e) => {
    if (reset.contains(e.target) || !skip()) return;
    swallow = true; clearTimeout(swallowTimer); swallowTimer = setTimeout(() => { swallow = false; }, 1000);
  }, true);
  addEventListener('pointercancel', () => { swallow = false; }, true);
  addEventListener('click', (e) => { if (swallow && e.isTrusted) { swallow = false; e.preventDefault(); e.stopPropagation(); } }, true);
  addEventListener('keydown', (e) => {
    if (document.activeElement === reset || !skip()) return;
    if (e.key === 'Enter' || e.key === ' ') e.preventDefault();
  }, true);
  addEventListener('wheel', skip, { passive: true });
  addEventListener('scroll', skip, { passive: true });
  const snapTo = (a) => { aperture = a; voidEl.style.transform = a < 1 ? `translate(-50%, -50%) scale(${a.toFixed(4)})` : ''; layout(); drawStatic(); };
  // The pointer goes quiet after the tap that enters (not on touch: there's nothing to hide), and comes
  // back on its first real move, or if the page loses focus or is hidden. Only listened for while hidden.
  let tapType = '', tapAt = { x: 0, y: 0 };
  door.addEventListener('pointerdown', (e) => { tapType = e.pointerType; tapAt = { x: e.clientX, y: e.clientY }; });
  const showCursor = () => {
    root.classList.remove('cursor-hidden');
    removeEventListener('pointermove', moved); removeEventListener('blur', showCursor);
    document.removeEventListener('visibilitychange', showCursor);
  };
  const moved = (e) => { if (e.clientX !== tapAt.x || e.clientY !== tapAt.y) showCursor(); };
  function hideCursor() {
    if (tapType === 'touch') return;
    root.classList.add('cursor-hidden');
    addEventListener('pointermove', moved, { passive: true }); addEventListener('blur', showCursor);
    document.addEventListener('visibilitychange', showCursor);
  }
  function enter(listen) {
    if (!root.classList.contains('entering')) return;
    hideCursor();
    try { localStorage.setItem('hum.entered', '1'); } catch (e) {}
    const focused = door.contains(document.activeElement);
    if (graph && !on) { clearTimeout(tearDown); destroy(); }   // a reset's fade still running: listen builds fresh and tunes in
    if (listen) { aimTuneIn = true; btn.click(); }
    if (!reduced) pace();
    root.classList.add('opening'); root.classList.remove('entering', 'arriving');
    if (reduced) {
      root.classList.add('dark');
      setTimeout(() => { snapTo(1); root.classList.remove('dark'); }, 600);
    }
    setTimeout(() => {
      root.classList.remove('opening');
      if (focused && root.matches('.pacing:not(.landed)')) refocus = true;   // the name isn't back yet: focus it when it is
      else if (focused) btn.focus({ preventScroll: true });
    }, reduced ? 1500 : 4000);
  }
  function leave() {
    if (root.matches('.entering, .opening, .leaving')) return;
    try { localStorage.removeItem('hum.entered'); localStorage.removeItem('hum.heard'); } catch (e) {}
    const focused = document.activeElement === reset;
    if (on) btn.click();   // the header's own switch: the hum fades over 2 s
    clearTimeout(markTimer); root.classList.remove('mark-in');   // the end mark goes first (CSS: .leaving)
    halt(); refocus = false;
    flow = null;   // the verse holds where it is and is drawn in from there
    root.classList.add('leaving');
    if (reduced) root.classList.add('dark');
    // The verse starts falling in; DRAWIN_LEAD later the void closes after it, and the door comes back as it lands.
    let back = false;
    const door_ = () => { if (back) return; back = true;
      if (reduced) { snapTo(SHUT); root.classList.remove('dark'); }   // the hum's 2 s fade may outlast this; enter() clears it
      unpace(); root.classList.remove('quiet-mark');   // the door: the verse back in place, unseen, for the next entrance
      root.classList.add('entering', 'arriving'); root.classList.remove('leaving');
      if (focused) door.querySelector('.door-in').focus({ preventScroll: true });
      setTimeout(() => root.classList.remove('arriving'), 1200);
    };
    if (reduced) setTimeout(door_, 600);
    else {
      swing(SHUT, performance.now() + DRAWIN_LEAD * 1000, CLOSE_MS, expoInOut);
      setTimeout(door_, DRAWIN_LEAD * 1000 + CLOSE_MS);   // as the void lands
    }
  }
  door.querySelector('.door-in').addEventListener('click', () => enter(true));
  door.querySelector('.door-quiet').addEventListener('click', () => enter(false));
  reset.addEventListener('click', leave);

  document.addEventListener('visibilitychange', () => {
    if (!graph || !on) return;
    clearTimeout(hideTimer);
    if (document.hidden) {
      ramp(0, 0.3);
      hideTimer = setTimeout(() => { if (document.hidden && graph) actx.suspend().catch(() => {}); }, 400);
    } else {
      actx.resume().then(() => { if (graph && on) ramp(LEVEL, 1.5); }).catch(() => {});
    }
  });

  // Leaving through the footer: let the hum fall away before the next page. New-tab clicks go straight through.
  const LEAVE_FADE = 0.6;
  document.querySelectorAll('.foot a').forEach((a) => a.addEventListener('click', (e) => {
    if (!graph || !on || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    ramp(0, LEAVE_FADE);
    setTimeout(() => { location.href = a.href; }, LEAVE_FADE * 1000 + 50);
  }));
  // Back from a link: the page can return from the back-forward cache with the hum faded out.
  addEventListener('pageshow', (e) => {
    if (e.persisted && graph && on) actx.resume().then(() => { if (graph && on) ramp(LEVEL, 1.5); }).catch(() => {});
  });
})();
</script>
</body>

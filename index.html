<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Everything is humming. Alignment is not sameness: the tension of differences, held until it sings.">
<meta name="theme-color" content="#0b0a14">
<link rel="canonical" href="https://thehum.is/">
<meta property="og:title" content="The Hum">
<meta property="og:description" content="Alignment is not sameness. The tension of differences, held until it sings.">
<meta property="og:url" content="https://thehum.is/">
<title>The Hum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap" rel="stylesheet">
<style>
  /* One dark theme, on purpose. The sister page radiates; this one draws in. */
  :root {
    color-scheme: dark;
    --field: #0b0a14;
    --corner: #060510;
    --ink: #e6e2f0;
    --ink-dim: #8f87b0;
    --ring: #b48cff;
    --magenta: #ff5fb8;
    --teal: #4fd6c8;
    /* Void diameter. Desktop: fixed. Phone: wider than the screen, so the
       ring reads as a horizon, not a badge. Cap keeps the verse inside. */
    --d: 560px;
    --inscription-size: 11px;
    --verse-size: 20px;
    --verse-lh: 1.55;
    --verse-w: min(80vw, 420px);
    --footer-h: 44px;
    --footer-gap: 28px;
  }
  @media (max-width: 700px) {
    :root {
      --d: clamp(560px, 150vw, 720px);
      --inscription-size: 10px;
      --verse-size: 17px;
      --verse-lh: 1.5;
      --verse-w: 80vw;
    }
  }

  html { background: var(--corner); }
  body {
    margin: 0;
    min-height: 100svh;
    position: relative;
    color: var(--ink);
    background: var(--field);
    /* Vignette only. No other gradient belongs here. */
    background-image: radial-gradient(ellipse 80% 80% at 50% 50%, var(--field) 55%, var(--corner) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* The stage is pinned to the viewport: the void's center is the viewport's. */
  .stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  /* Flat interior. Nothing animated crosses it; the canvas only paints outside r. */
  .void {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--d);
    height: var(--d);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    /* Depth without motion: just off the field at the rim, near-black at the center. A hole that recedes. */
    background: radial-gradient(circle closest-side, #040309 0%, #06050d 45%, #0a0915 82%, #0d0b18 100%);
  }
  /* The name frames the page from the top edge, as the link does from the bottom. */
  .head {
    position: absolute; left: 0; right: 0; top: 0; z-index: 2; margin: 0; /* above the verse flow, so the switch takes the tap */
    padding-top: calc(var(--footer-gap) + 14px + env(safe-area-inset-top, 0px));
    display: flex; flex-direction: column; align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500; font-size: var(--inscription-size);
    letter-spacing: 0.38em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  /* The name is also the switch. Same look as before; the tap target grows
     downward into the dark so the text doesn't move. */
  .hum-toggle {
    appearance: none; -webkit-appearance: none;
    background: none; border: 0; margin: 0; box-sizing: border-box;
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
    opacity: 0.75;
    display: inline-flex; align-items: flex-start;
    min-width: 44px; min-height: 44px; line-height: 13px;
    /* left pad balances the trailing tracking, so THE HUM stays centered */
    padding: 0 0 31px 0.38em;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: opacity 300ms ease;
  }
  .hum-toggle:hover { opacity: 0.95; }
  .hum-toggle:focus { outline: none; }
  .hum-toggle:focus-visible .hum-text {
    outline: 1px solid rgba(180,140,255,0.6); outline-offset: 5px; border-radius: 2px;
  }
  /* On: the words themselves hum — brighter, with a soft glow that swells and settles every 2 s. */
  .hum-text { transition: color 2s ease, text-shadow 2s ease; }
  .hum-toggle[aria-pressed="true"] { opacity: 0.95; }
  .hum-toggle[aria-pressed="true"] .hum-text {
    color: #cfc6ee;
    animation: hum-pulse 2s ease-in-out 1.5s infinite;
  }
  @keyframes hum-pulse {
    0%, 100% { color: #b9b0da; text-shadow: 0 0 4px rgba(180,140,255,0.15); }
    50% { color: #ece6ff; text-shadow: 0 0 9px rgba(180,140,255,0.55); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hum-toggle[aria-pressed="true"] .hum-text { animation: none; }
  }
  .hum-hint {
    margin-top: -22px;
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 300;
    font-size: 11px; letter-spacing: 0.02em; text-transform: none;
    color: var(--ink-dim); opacity: 0.45;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }
  .hum-hint.fade { opacity: 0; }

  /* Verse sits in flow so a short viewport scrolls instead of clipping.
     Symmetric padding keeps it on the viewport center when it fits; the
     bottom pad also reserves the footer's room. */
  .verse-wrap {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    box-sizing: border-box;
    padding: 84px 0 calc(84px + env(safe-area-inset-bottom, 0px));
    display: grid;
    place-items: center;
  }
  .verse {
    width: var(--verse-w);
    margin: 0;
    text-align: center;
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-weight: 300;
    font-size: var(--verse-size);
    line-height: var(--verse-lh);
    color: var(--ink);
  }
  .verse p { margin: 0; }
  .verse p + p { margin-top: calc(var(--verse-size) * var(--verse-lh)); }
  .verse span {
    display: block;
    text-wrap: balance;
  }
  .verse .turn {
    font-style: italic;
    color: #f3f0fa;
  }

  .foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    padding-bottom: calc(var(--footer-gap) + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }
  .foot a {
    display: inline-flex;
    align-items: center;
    min-height: var(--footer-h);
    padding: 0 12px;
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: 14px;
    color: var(--ink-dim);
    opacity: 0.75;
    text-decoration: none;
    transition: color 300ms ease, opacity 300ms ease;
  }
  .foot a:hover, .foot a:focus-visible {
    color: var(--ink);
    opacity: 1;
    outline: none;
  }
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <canvas id="field"></canvas>
  <div class="void"></div>
</div>

<h1 class="head">
  <button type="button" class="hum-toggle" id="hum" aria-pressed="false" aria-label="Turn the hum on"><span class="hum-text">The Hum</span></button>
  <span class="hum-hint" id="hum-hint" aria-hidden="true" hidden>tap to listen</span>
</h1>

<main class="verse-wrap">
  <div class="verse">
    <p>
      <span>Everything is humming.</span>
      <span>One tone alone is sameness.</span>
      <span>Every tone at once is noise.</span>
      <span>Harmony lives at the edges between them,</span>
      <span>where each voice keeps its own note.</span>
    </p>
    <p class="turn">
      <span>Alignment is not sameness.</span>
      <span>The tension of differences,</span>
      <span>held until it sings.</span>
    </p>
  </div>
</main>

<footer class="foot">
  <a href="https://thehum.works">thehum.works</a>
</footer>

<script>
(() => {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const voidEl = document.querySelector('.void');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const RING = '#b48cff', MAGENTA = '#ff5fb8', TEAL = '#4fd6c8';
  const TAU = Math.PI * 2;

  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, r = 280, maxR = 0;
  let glow = null;      // cached outer glow, drawn once per resize
  let ringGrad = null;  // cached conic tint
  let points = [];

  const mix = (a, b, t) => {
    const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
    return pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  // Far points are dim and cool; near the ring they warm toward the ring itself.
  const FAR = mix('#5e5484', TEAL, 0.35);
  const NEAR = mix(RING, MAGENTA, 0.25);

  function layout() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2;
    r = voidEl.getBoundingClientRect().width / 2;
    maxR = Math.hypot(W, H) / 2;

    // Glow: outside the ring only, so the interior stays flat.
    const gs = Math.ceil((r + 24) * 2), g = document.createElement('canvas');
    g.width = g.height = Math.round(gs * dpr);
    const gc = g.getContext('2d'); gc.scale(dpr, dpr);
    const grad = gc.createRadialGradient(gs / 2, gs / 2, 0, gs / 2, gs / 2, r + 18);
    const e = r / (r + 18);
    grad.addColorStop(0, 'rgba(180,140,255,0)');
    grad.addColorStop(e, 'rgba(180,140,255,0)');
    grad.addColorStop(e + 0.0001, 'rgba(180,140,255,0.22)');
    grad.addColorStop(e + (1 - e) * 0.35, 'rgba(180,140,255,0.07)');
    grad.addColorStop(1, 'rgba(180,140,255,0)');
    gc.fillStyle = grad; gc.fillRect(0, 0, gs, gs);
    glow = { c: g, s: gs };

    // Ring tint: magenta near 11 o'clock, teal near 5. Narrow, faint.
    if (ctx.createConicGradient) {
      ringGrad = ctx.createConicGradient(0, cx, cy);
      const m = rgba(mix(RING, MAGENTA, 0.5), 1), t = rgba(mix(RING, TEAL, 0.5), 1);
      [[0, RING], [0.10, RING], [0.1667, t], [0.24, RING], [0.60, RING], [0.6667, m], [0.73, RING], [1, RING]]
        .forEach(([s, col]) => ringGrad.addColorStop(s, col));
    } else ringGrad = RING;

    const target = W < 700 ? 190 : 420;
    while (points.length < target) points.push(spawn(true));
    points.length = target;
  }

  // Shared rotation sense, small per-point variation.
  const spin = Math.random() < 0.5 ? 1 : -1;
  function spawn(initial) {
    // On a phone the ring overflows the sides; only the caps above and below
    // show sky. Lean the births that way so the field isn't empty there.
    let a = Math.random() * TAU;
    if (W < H && Math.random() < 0.7) a = (Math.random() < 0.5 ? -1 : 1) * Math.PI / 2 + (Math.random() - 0.5) * 1.2;
    const p = {
      a,
      rad: initial ? r + 6 + Math.random() * (maxR * 1.6 - r - 6) : maxR * (1.4 + Math.random() * 0.4),
      born: maxR * (1.4 + Math.random() * 0.4),
      w: spin * (2 + (Math.random() - 0.5) * 1.2) * Math.PI / 180,
      size: 0.9 + Math.random() * 1.1
    };
    if (initial) p.born = Math.max(p.born, p.rad + 1);
    return p;
  }

  function step(dt) {
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const d = p.rad - r;
      // Gravity: a slow drift far out, then the pull runs away — speed grows exponentially
      // over the last ~100 px (≈7 px/s far, ≈50 at 60 px, ≈170 at the edge), and the swirl
      // tightens with it, so each point spirals and is swallowed.
      const pull = Math.exp(-d / 38);
      p.rad -= (7 + 175 * pull) * dt;
      p.a += (p.w * 120 / Math.max(p.rad, 1)) * (1 + 3 * pull) * dt;
      if (p.rad <= r + 6) points[i] = spawn(false);   // nothing enters the ring
    }
  }

  // Doppler beaming: a real photon ring is brighter on the side moving toward us.
  // The bright side travels the ring once a minute, so it has weight and motion
  // without getting louder. Drawn as short arcs so brightness can vary by angle.
  const STOPS = 96, BEAM_PERIOD = 60000;
  // Base tint by angle (fraction of a turn from 3 o'clock, clockwise): teal near 5, magenta near 11.
  const near = (f, c, w) => { const d = Math.min(Math.abs(f - c), 1 - Math.abs(f - c)); return Math.exp(-(d * d) / (2 * w * w)); };
  const tintAt = f => mix(rgba0(mix(RING, TEAL, 0.5 * near(f, 0.1667, 0.035))), MAGENTA, 0.5 * near(f, 0.6667, 0.035));
  // Accretion light is clumpy: brightness churns along the ring (three drifting waves at
  // incommensurate speeds) and hot spots flare, orbit and fade. Beaming still favours one side.
  const spots = [];
  const vis = { phi: 0, hot: 0 };   // ring state shared with the sound, written once per frame in drawRing
  function newSpot(t) {
    return { th: Math.random() * TAU, w: spin * (0.12 + Math.random() * 0.25), born: t,
             life: 4 + Math.random() * 7, sig: 0.09 + Math.random() * 0.1, peak: 0.35 + Math.random() * 0.35 };
  }
  function brightness(th, t, phi) {
    const beam = Math.pow((1 + Math.cos(th - phi)) / 2, 1.6);
    const turb = 0.5 + 0.5 * (0.5 * Math.sin(3 * th + 0.21 * t * spin) + 0.3 * Math.sin(7 * th - 0.37 * t + 1.3) + 0.2 * Math.sin(13 * th + 0.53 * t * spin + 2.1));
    let hot = 0;
    for (const sp of spots) {
      const age = t - sp.born, env = Math.sin(Math.PI * Math.min(1, Math.max(0, age / sp.life)));
      let d = Math.abs(((th - (sp.th + sp.w * age)) % TAU + TAU) % TAU); d = Math.min(d, TAU - d);
      hot += sp.peak * env * Math.exp(-(d * d) / (2 * sp.sig * sp.sig));
    }
    return Math.min(1, 0.12 + 0.88 * beam * (0.35 + 0.65 * turb) + hot * (0.4 + 0.6 * beam));
  }
  function ringGradient(bs, scale) {
    if (!ctx.createConicGradient) return rgba(mix(RING, RING, 0), 0.6 * scale);
    const g = ctx.createConicGradient(0, cx, cy);
    for (let i = 0; i <= STOPS; i++) g.addColorStop(i / STOPS, rgba(tintAt(i / STOPS), Math.min(1, bs[i % STOPS] * scale)));
    return g;
  }
  function drawRing(alpha, now) {
    const t = (now || 0) / 1000;
    if (!reduced) {
      while (spots.length < 3) spots.push(newSpot(t));
      for (let i = 0; i < spots.length; i++) if (t - spots[i].born > spots[i].life) spots[i] = newSpot(t);
    }
    const phi = ((now || 0) / BEAM_PERIOD) * TAU * spin;
    // What the sound is allowed to know: where the bright side is, how hot the spots are.
    vis.phi = phi; vis.hot = 0;
    for (const sp of spots) vis.hot += sp.peak * Math.sin(Math.PI * Math.min(1, Math.max(0, (t - sp.born) / sp.life)));
    const bs = [];
    for (let i = 0; i < STOPS; i++) bs.push(brightness((i / STOPS) * TAU, t, phi));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(glow.c, cx - glow.s / 2, cy - glow.s / 2, glow.s, glow.s);
    // Outer profile: one soft band fading ~14px outward, fuller where the ring is bright.
    if ('filter' in ctx) {
      // Three passes, widest and faintest first: a long haze, a wash, then the body.
      ctx.filter = 'blur(18px)';
      ctx.strokeStyle = ringGradient(bs, 0.09); ctx.lineWidth = 44;
      ctx.beginPath(); ctx.arc(cx, cy, r + 20, 0, TAU); ctx.stroke();
      ctx.filter = 'blur(19px)';
      ctx.strokeStyle = ringGradient(bs, 0.1); ctx.lineWidth = 30;
      ctx.beginPath(); ctx.arc(cx, cy, r + 6, 0, TAU); ctx.stroke();
      ctx.filter = 'blur(7px)';
      ctx.strokeStyle = ringGradient(bs, 0.2); ctx.lineWidth = 14;
      ctx.beginPath(); ctx.arc(cx, cy, r + 7, 0, TAU); ctx.stroke();
      ctx.filter = 'none';
    } else {
      for (let k = 32; k >= 1; k--) {   // tight overlap so no grooves resolve; long, soft tail
        ctx.strokeStyle = ringGradient(bs, 0.22 * Math.pow(1 - k / 33, 2.8)); ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.arc(cx, cy, r + 0.5 + k * 1.1, 0, TAU); ctx.stroke();
      }
    }
    // The horizon itself: razor sharp on the inside, where light stops.
    ctx.strokeStyle = ringGradient(bs.map(b => 0.3 + 0.7 * b), 1); ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function drawPoints() {
    for (const p of points) {
      const x = cx + Math.cos(p.a) * p.rad, y = cy + Math.sin(p.a) * p.rad;
      let t = Math.min(1, Math.max(0, 1 - (p.rad - r) / (p.born - r)));
      t = t * t;              // most of the warming happens near the ring
      const edge = Math.min(1, Math.max(0, (p.rad - r - 6) / 10));   // the last few px: gone into the glow
      const alpha = (0.2 + 0.55 * t) * edge, size = p.size * (0.6 + 0.4 * edge);
      ctx.fillStyle = rgba(mix(rgba0(FAR), rgba0(NEAR), t), alpha);
      ctx.fillRect(x - size / 2, y - size / 2, size, size);
    }
  }
  const rgba0 = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');

  let last = 0, t0 = performance.now(), raf = 0;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    ctx.clearRect(0, 0, W, H);
    step(dt);
    drawPoints();
    drawRing(1, now - t0);
    humTick(now);
    raf = requestAnimationFrame(frame);
  }
  function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  function drawStatic() { ctx.clearRect(0, 0, W, H); drawRing(0.9, BEAM_PERIOD * 0.15); }

  layout();
  if (reduced) {
    drawStatic();
    addEventListener('resize', () => { layout(); drawStatic(); });
  } else {
    addEventListener('resize', layout);
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
    start();
  }

  // ---- The hum --------------------------------------------------------------
  // A chord on the year tone (C♯) in just ratios off the harmonic series, each voice breathing on
  // its own period so the texture never quite repeats. Room tone, not music.
  // Off until asked; everything is built inside the tap, which is what phones require.
  const ROOT = 68.05;   // C♯2: the Earth year (1 / 365.2422 days) raised 32 octaves → 136.10 Hz, here one octave down
  // The chord travels the verse: from sameness (an open fifth) through harmony to the edge of noise
  // (a cluster), on the same root. A slow random walk between neighbours; dissonance is a short
  // visit that always resolves. Tones are just ratios within one octave.
  const CHORDS = {
    open:    { tones: [1, 3/2],               hold: [35, 55],  next: { major: 5, sus2: 2.5, sus4: 2.5 } },
    major:   { tones: [1, 5/4, 3/2],          hold: [35, 55],  next: { open: 2, sus2: 2, sus4: 2, dom7: 2.5, minor: 1.5 } },
    sus2:    { tones: [1, 9/8, 3/2],          hold: [25, 45],   next: { major: 4, minor: 3.5, open: 2.5 } },
    sus4:    { tones: [1, 4/3, 3/2],          hold: [25, 45],   next: { major: 4.5, dom7: 3, cluster: 1.5 } },
    minor:   { tones: [1, 6/5, 3/2],          hold: [25, 45],  next: { min7: 3.5, sus2: 2.5, neutral: 2.5, cluster: 1.5 } },
    min7:    { tones: [1, 6/5, 3/2, 9/5],     hold: [25, 45],   next: { minor: 5, tritone: 2, sus4: 3 } },
    dom7:    { tones: [1, 5/4, 3/2, 7/4],     hold: [25, 45],   next: { major: 5.5, tritone: 2, sus4: 2.5 } },
    neutral: { tones: [1, 11/9, 3/2],         hold: [25, 40],   next: { minor: 4, major: 4, open: 2 } },
    cluster: { tones: [1, 16/15, 3/2],        hold: [12, 20],   next: { sus2: 5, minor: 5 } },        // the edge of noise
    tritone: { tones: [1, 45/32, 7/4],        hold: [12, 20],   next: { dom7: 4, sus4: 3, major: 3 } },
  };
  // Each voice keeps its register and takes the nearest chord tone there, so movement is by small steps.
  const snap = (r0, tones, isRoot) => {
    if (isRoot) return r0;
    let best = r0, bd = Infinity;
    for (const tn of tones) for (let k = -1; k <= 4; k++) {
      const c = tn * Math.pow(2, k), d = Math.abs(Math.log2(c / r0));
      if (d < bd) { bd = d; best = c; }
    }
    return best;
  };
  const pickNext = (name) => {
    const opts = Object.entries(CHORDS[name].next), total = opts.reduce((a, [, w]) => a + w, 0);
    let x = Math.random() * total;
    for (const [n, w] of opts) { x -= w; if (x <= 0) return n; }
    return opts[0][0];
  };
  const MAIN_R0 = [1, 3/2, 2, 5/2, 7/2];   // the top voice sits where a 7th can land
  const LFO_PERIODS = [13, 17, 19, 23, 29];
  const VOICE_GAIN = [0.07, 0.08, 0.07, 0.062, 0.055];                  // the root is felt more than heard
  // Upper harmony: the series one and two octaves up (×4 … ×12), pure sines that drift in
  // and out on long incommensurate cycles and sit slightly apart in the stereo field.
  const UPPER = [4, 5, 6, 8], UPPER_PERIODS = [31, 37, 41, 43];
  const UPPER_GAIN = [0.024, 0.021, 0.018, 0.012], UPPER_PAN = [-0.45, 0.35, -0.2, 0.5];
  // Choir, humming: low alto to mezzo (×3 … ×7, ~200–480 Hz). A hum is mostly fundamental,
  // muffled through the nose (a dip in the upper mids). Each voice is a few singers who drift a
  // little, breathe on their own schedule, and scoop up into the note when they come back in.
  const CHOIR = [3, 4, 5, 6, 7], CHOIR_PERIODS = [53, 59, 61, 67, 71];
  const CHOIR_GAIN = [0.018, 0.017, 0.016, 0.014, 0.011], CHOIR_PAN = [0.3, -0.35, 0.45, -0.4, 0.15];

  const SWELL = 4, LEVEL = 0.55;                                         // which voice the hot spots lean on; master ceiling
  const btn = document.getElementById('hum'), hint = document.getElementById('hum-hint');
  const debug = location.hash === '#humdebug';
  let actx = null, graph = null, on = false, timers = [], tearDown = 0, hideTimer = 0, silent = null;
  let lastTick = 0, chord = 'major', detuning = false;

  const heard = () => { try { return !!localStorage.getItem('hum.heard'); } catch (e) { return false; } };
  const remember = () => { try { localStorage.setItem('hum.heard', '1'); } catch (e) {} };
  if (!heard()) hint.hidden = false;

  function impulse(ac, secs) {   // a room, synthesized: decaying noise, ~5 s
    const n = Math.round(ac.sampleRate * secs), buf = ac.createBuffer(2, n, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-6 * i / n) * Math.min(1, i / 400);
    }
    return buf;
  }
  function noiseBuf(ac) {
    const n = ac.sampleRate * 2, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function build() {
    const ac = actx, now = ac.currentTime, sources = [];
    const master = ac.createGain(); master.gain.value = 0;
    const filter = ac.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1700; filter.Q.value = 0.5;
    const pan = ac.createStereoPanner();
    const dry = ac.createGain(); dry.gain.value = 0.8;
    const conv = ac.createConvolver(); conv.buffer = impulse(ac, 5);
    const wet = ac.createGain(); wet.gain.value = 0.4;
    // Pull the low end back: a gentle shelf, so the bass is a floor, not the room.
    const shelf = ac.createBiquadFilter(); shelf.type = 'lowshelf'; shelf.frequency.value = 150; shelf.gain.value = -6;
    filter.connect(shelf); shelf.connect(pan); pan.connect(dry); pan.connect(conv); conv.connect(wet);
    dry.connect(master); wet.connect(master); master.connect(ac.destination);
    // Air: the lowpass wanders 1000–2400 Hz over ~40 s, open enough for the upper voices.
    const fl = ac.createOscillator(); fl.frequency.value = 1 / 40;
    const flg = ac.createGain(); flg.gain.value = 700;
    fl.connect(flg); flg.connect(filter.frequency); fl.start(now); sources.push(fl);
    // Vibrato, idle until a bloom: a ~5–6 Hz sine into each pitch's detune, depth 0 at rest.
    const vibrato = (targets) => {
      const o = ac.createOscillator(); o.frequency.value = 5.5;
      const depth = ac.createGain(); depth.gain.value = 0;
      o.connect(depth); for (const p of targets) depth.connect(p);
      o.start(now); sources.push(o);
      return { rate: o.frequency, depth: depth.gain };
    };
    // Soft partials; sines read as sub on small speakers.
    const pw = ac.createPeriodicWave(new Float32Array([0, 0, 0, 0, 0]), new Float32Array([0, 1, 0.16, 0.05, 0.015]));
    const swell = ac.createGain(); swell.gain.value = 1; swell.connect(filter);
    const voices = MAIN_R0.map((r0, i) => {
      const osc = ac.createOscillator(); osc.setPeriodicWave(pw); osc.frequency.value = ROOT * snap(r0, CHORDS[chord].tones, i === 0);
      const g = ac.createGain(); g.gain.value = VOICE_GAIN[i] * 0.65;
      const lfo = ac.createOscillator(); lfo.frequency.value = 1 / LFO_PERIODS[i];
      const lg = ac.createGain(); lg.gain.value = VOICE_GAIN[i] * 0.35;
      lfo.connect(lg); lg.connect(g.gain);
      osc.connect(g); g.connect(i === SWELL ? swell : filter);
      osc.start(now); lfo.start(now); sources.push(osc, lfo);
      return { osc, g, vib: vibrato([osc.detune]), kind: 'main' };
    });
    const upper = UPPER.map((ratio, i) => {
      const osc = ac.createOscillator(); osc.type = 'sine'; osc.frequency.value = ROOT * snap(ratio, CHORDS[chord].tones, false);
      const g = ac.createGain(); g.gain.value = UPPER_GAIN[i] * 0.8;   // swells 60–100%: the drone holds
      const lfo = ac.createOscillator(); lfo.frequency.value = 1 / UPPER_PERIODS[i];
      const lg = ac.createGain(); lg.gain.value = UPPER_GAIN[i] * 0.2;
      const sp = ac.createStereoPanner(); sp.pan.value = UPPER_PAN[i];
      lfo.connect(lg); lg.connect(g.gain);
      osc.connect(g); g.connect(sp); sp.connect(filter);
      osc.start(now); lfo.start(now + Math.random() * UPPER_PERIODS[i]); sources.push(osc, lfo);
      return { osc, r0: ratio, vib: vibrato([osc.detune]), kind: 'upper' };
    });
    // A voice-like source: many harmonics rolling off ~1/n^1.7, like vocal folds rather than an organ pipe.
    const vh = new Float32Array(16); for (let n = 1; n < 16; n++) vh[n] = Math.pow(n, -1.7);
    const vox = ac.createPeriodicWave(new Float32Array(16), vh);
    const nzb = noiseBuf(ac);
    // Human irregularity: slow-ish random noise (lowpassed to a few Hz) wobbling pitch and level.
    const wobble = (dest, scale, hz) => {
      const n = ac.createBufferSource(); n.buffer = nzb; n.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = hz; lp.Q.value = 0.5;
      const k = ac.createGain(); k.gain.value = scale;
      n.connect(lp); lp.connect(k); k.connect(dest); n.start(now, Math.random() * 2); sources.push(n);
    };
    // The nose: a dip around 1.1 kHz and a soft lowpass; lips closed.
    const nasal = ac.createBiquadFilter(); nasal.type = 'peaking'; nasal.frequency.value = 1100; nasal.Q.value = 1.4; nasal.gain.value = -14;
    const lips = ac.createBiquadFilter(); lips.type = 'lowpass'; lips.frequency.value = 1300; lips.Q.value = 0.4;
    nasal.connect(lips); lips.connect(filter);
    // Inhales: a whisper of filtered noise, bumped when a voice breathes.
    const inz = ac.createBufferSource(); inz.buffer = noiseBuf(ac); inz.loop = true;
    const ibp = ac.createBiquadFilter(); ibp.type = 'bandpass'; ibp.frequency.value = 1800; ibp.Q.value = 0.7;
    const inhale = ac.createGain(); inhale.gain.value = 0;
    inz.connect(ibp); ibp.connect(inhale); inhale.connect(filter); inz.start(now); sources.push(inz);
    const choir = CHOIR.map((ratio, i) => {
      const g = ac.createGain(); g.gain.value = CHOIR_GAIN[i] * 0.8;   // swells 60–100%: present, not coming and going
      const lfo = ac.createOscillator(); lfo.frequency.value = 1 / CHOIR_PERIODS[i];
      const lg = ac.createGain(); lg.gain.value = CHOIR_GAIN[i] * 0.2;
      const phrase = ac.createGain(); phrase.gain.value = 1;                                 // breath gaps
      const sp = ac.createStereoPanner(); sp.pan.value = CHOIR_PAN[i];
      lfo.connect(lg); lg.connect(g.gain); g.connect(phrase); phrase.connect(sp); sp.connect(nasal);
      const oscs = [];
      for (const cents of [-6, 0, 5]) {                                                      // a few singers on one note
        const osc = ac.createOscillator(); osc.setPeriodicWave(vox);
        osc.frequency.value = ROOT * snap(ratio, CHORDS[chord].tones, false); osc.detune.value = cents;
        // Drift, not vibrato: two slow, uneven wanders of a few cents per singer.
        for (const [hz, depth] of [[0.07 + Math.random() * 0.08, 3], [0.17 + Math.random() * 0.1, 2]]) {
          const w = ac.createOscillator(); w.frequency.value = hz;
          const wd = ac.createGain(); wd.gain.value = depth;
          w.connect(wd); wd.connect(osc.detune); w.start(now + Math.random() * 10); sources.push(w);
        }
        wobble(osc.detune, 300, 6 + Math.random() * 4);                                     // jitter: ~4¢ RMS (lowpassed noise is ~0.0135 RMS)
        const sg = ac.createGain(); sg.gain.value = 1; wobble(sg.gain, 2.2, 4 + Math.random() * 3);   // shimmer: ~3% of level
        osc.connect(sg); sg.connect(g); osc.start(now); sources.push(osc); oscs.push(osc);
      }
      // Breath in the tone: air through the folds, pulsing at the voice's own pitch.
      const air = ac.createBufferSource(); air.buffer = nzb; air.loop = true;
      const ahp = ac.createBiquadFilter(); ahp.type = 'highpass'; ahp.frequency.value = 700;
      const am = ac.createGain(); am.gain.value = 0;
      const pulse = ac.createOscillator(); pulse.frequency.value = ROOT * snap(ratio, CHORDS[chord].tones, false);
      const pd = ac.createGain(); pd.gain.value = 0.5;
      const off = ac.createConstantSource(); off.offset.value = 0.5;
      pulse.connect(pd); pd.connect(am.gain); off.connect(am.gain);
      const al = ac.createGain(); al.gain.value = 0.35;
      air.connect(ahp); ahp.connect(am); am.connect(al); al.connect(g);
      air.start(now, Math.random() * 2); pulse.start(now); off.start(now); sources.push(air, pulse, off);
      lfo.start(now + Math.random() * CHOIR_PERIODS[i]); sources.push(lfo);
      return { phrase, oscs, pulse, vib: vibrato(oscs.map((o) => o.detune)), kind: 'choir', r0: ratio, f: ROOT * snap(ratio, CHORDS[chord].tones, false) };
    });
    // Colour: the harmonic 7th, below the fifth, mostly absent.
    const col = ac.createOscillator(); col.setPeriodicWave(pw); col.frequency.value = ROOT * 7 / 4;
    const colour = ac.createGain(); colour.gain.value = 0;
    col.connect(colour); colour.connect(filter); col.start(now); sources.push(col);
    // Breath: filtered noise, nearly subliminal.
    const nz = ac.createBufferSource(); nz.buffer = noiseBuf(ac); nz.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.8;
    const breath = ac.createGain(); breath.gain.value = 0.006;
    const bl = ac.createOscillator(); bl.frequency.value = 1 / 11;
    const blg = ac.createGain(); blg.gain.value = 0.004;
    bl.connect(blg); blg.connect(breath.gain);
    nz.connect(bp); bp.connect(breath); breath.connect(filter); nz.start(now); bl.start(now); sources.push(nz, bl);
    graph = { master, filter, pan, swell, voices, upper, colour, sources, choir, inhale };
  }
  function destroy() {
    for (const id of timers) clearTimeout(id);
    timers = []; detuning = false; blooming = 0;
    for (const s of graph.sources) { try { s.stop(); } catch (e) {} }
    graph.master.disconnect();
    graph = null;
    actx.suspend().catch(() => {});
    if (silent) silent.pause();
  }
  // Stop a param where it is right now — mid-ramp included — instead of snapping back to the
  // ramp's start (what a bare cancelScheduledValues does).
  const freeze = (p, t) => {
    if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
    else { const v = p.value; p.cancelScheduledValues(t); p.setValueAtTime(v, t); }
  };
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const hold = (p, from, to, up, stay, down, t) => {   // ramp up, hold, ramp back
    p.cancelScheduledValues(t); p.setValueAtTime(from, t);
    p.linearRampToValueAtTime(to, t + up); p.setValueAtTime(to, t + up + stay); p.linearRampToValueAtTime(from, t + up + stay + down);
  };

  // Tension held: one voice drifts a few cents off pure, beats, then comes home. Never two at once.
  function scheduleDetune() {
    later(() => {
      if (!graph) return;
      if (!detuning) {
        detuning = true;
        const v = graph.voices[1 + Math.floor(Math.random() * 4)];
        const cents = (3 + Math.random() * 6) * (Math.random() < 0.5 ? -1 : 1), stay = 6 + Math.random() * 6;
        hold(v.osc.detune, 0, cents, 4, stay, 4, actx.currentTime);
        later(() => { detuning = false; }, (stay + 8.5) * 1000);
      }
      scheduleDetune();
    }, 20000 + Math.random() * 20000);
  }
  // Shifting: the chord slides to a neighbouring voicing along the series. The root stays.
  // Breathing, rarely: every 12–30 s one humming voice, chosen at random, lets go, breathes and
  // scoops back in. The rest keep droning. Variance, not a pattern.
  function scheduleBreath() {
    later(() => {
      if (!graph) return;
      const t = actx.currentTime;
      const still = graph.choir.filter((c) => !(c.until > t + 2));              // never breathe mid-glide
      const v = still[Math.floor(Math.random() * still.length)];
      if (!v) { scheduleBreath(); return; }
      const gap = 0.9 + Math.random() * 0.9;
      v.phrase.gain.cancelScheduledValues(t); v.phrase.gain.setTargetAtTime(0, t, 0.22);
      const ig = graph.inhale.gain;
      ig.setTargetAtTime(0.0035, t + 0.45, 0.12); ig.setTargetAtTime(0, t + gap - 0.15, 0.1);
      v.phrase.gain.setTargetAtTime(1, t + gap, 0.16);
      for (const o of v.oscs) {
        o.frequency.cancelScheduledValues(t + gap);
        o.frequency.setValueAtTime(v.f * Math.pow(2, -28 / 1200), t + gap);   // ~28¢ flat
        o.frequency.setTargetAtTime(v.f, t + gap, 0.11);
      }
      scheduleBreath();
    }, 12000 + Math.random() * 18000);
  }
  // The walk: hold a chord for an uneven time (mostly mid-range, sometimes a quick turn, sometimes
  // a long settle), then glide to the next at an uneven speed (3–20 s). Voices don't move in lockstep:
  // each sets off a little early or late and takes its own time, so for a few seconds the chord is
  // between chords — some voices arrived, others still sliding. That passing friction is the warp.
  function holdFor(lo, hi) {
    const x = Math.random();
    if (x < 0.12) return lo * (0.45 + Math.random() * 0.3);          // a quick turn
    if (x > 0.88) return hi * (1.2 + Math.random() * 0.6);           // a long settle
    return lo + (hi - lo) * (Math.random() + Math.random()) / 2;     // mostly the middle
  }
  function scheduleGlide() {
    const [lo, hi] = CHORDS[chord].hold;
    later(() => {
      if (!graph) return;
      chord = pickNext(chord);
      const tones = CHORDS[chord].tones, t = actx.currentTime;
      const dur = 3 + 17 * Math.pow(Math.random(), 0.75);               // 3–20 s, leaning slow
      const spread = Math.min(4, dur * 0.35);
      const glide = (p, hz, off, d) => {
        freeze(p, t); p.setValueAtTime(p.value, t + off); p.exponentialRampToValueAtTime(hz, t + off + d);
      };
      const own = () => [Math.random() * spread, dur * (0.7 + Math.random() * 0.6)];
      graph.voices.forEach((v, i) => { const [o, d] = own(); glide(v.osc.frequency, ROOT * snap(MAIN_R0[i], tones, i === 0), o, d); });
      graph.upper.forEach((u) => { const [o, d] = own(); glide(u.osc.frequency, ROOT * snap(u.r0, tones, false), o, d); });
      graph.choir.forEach((c) => {
        const [o, d] = own();                                            // one person: their singers move together
        c.f = ROOT * snap(c.r0, tones, false); c.until = t + o + d + 0.3;
        for (const os of c.oscs) glide(os.frequency, c.f, o + Math.random() * 0.3, d);
        glide(c.pulse.frequency, c.f, o, d);
      });
      if (debug) console.log('[hum] chord →', chord, 'glide', dur.toFixed(1) + 's');
      scheduleGlide();
    }, holdFor(lo, hi) * 1000);
  }
  // Blooms: now and then one tone leans in — vibrato swells up, holds, and lets go. Mostly the
  // humming voices, wider and quicker; sometimes a synth voice, slower and narrower. At most two at once.
  let blooming = 0;
  function scheduleVibrato() {
    later(() => {
      if (!graph) return;
      if (blooming < 2) {
        const pool = [...graph.choir, ...graph.choir, ...graph.voices.slice(1), ...graph.upper].filter((v) => !v.blooming);
        const v = pool[Math.floor(Math.random() * pool.length)];
        if (v) {
          const t = actx.currentTime, choir = v.kind === 'choir';
          const cents = choir ? 12 + Math.random() * 23 : 6 + Math.random() * 12;
          const rate = choir ? 4.8 + Math.random() * 1.6 : 4 + Math.random() * 1.5;
          const up = 1.5 + Math.random() * 3, stay = 2 + Math.random() * 7, down = 2 + Math.random() * 4;
          v.vib.rate.cancelScheduledValues(t); v.vib.rate.setValueAtTime(rate * 0.85, t);
          v.vib.rate.linearRampToValueAtTime(rate, t + up);                    // quickens as it opens
          hold(v.vib.depth, 0, cents, up, stay, down, t);
          v.blooming = true; blooming++;
          later(() => { v.blooming = false; blooming--; }, (up + stay + down) * 1000);
          if (debug) console.log('[hum] bloom', v.kind, cents.toFixed(0) + '¢', rate.toFixed(1) + 'Hz');
        }
      }
      scheduleVibrato();
    }, 6000 + Math.random() * 16000);
  }
  function scheduleColour() {
    later(() => {
      if (!graph) return;
      hold(graph.colour.gain, 0, 0.03, 6, 8 + Math.random() * 8, 6, actx.currentTime);
      scheduleColour();
    }, 45000 + Math.random() * 45000);
  }
  // Once per frame from the ring loop, throttled: the sound leans toward the bright
  // side, and one voice swells with the hot spots.
  function humTick(now) {
    if (!graph || now - lastTick < 100) return;
    lastTick = now;
    const t = actx.currentTime;
    graph.pan.pan.setTargetAtTime(0.3 * Math.cos(vis.phi), t, 0.5);
    graph.swell.gain.setTargetAtTime(1 + 0.9 * Math.min(1, vis.hot), t, 0.7);
  }
  function ramp(to, secs) {
    const g = graph.master.gain, t = actx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(to, t + secs);
  }

  // iOS: claim the playback channel and keep a silent track looping, or the mute switch wins.
  function unmute() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
      if (!silent) {
        const n = 4000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
        const tag = (o, s) => { for (let i = 0; i < 4; i++) b[o + i] = s.charCodeAt(i); };
        tag(0, 'RIFF'); v.setUint32(4, 36 + n, true); tag(8, 'WAVE'); tag(12, 'fmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
        tag(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
        let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
        silent = new Audio('data:audio/wav;base64,' + btoa(s));
        silent.loop = true; silent.setAttribute('playsinline', '');
      }
      silent.play().catch(() => {});
    } catch (e) {}
  }

  function enable() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    unmute();
    actx.resume().catch(() => {});
    clearTimeout(tearDown);
    if (!graph) { build(); scheduleDetune(); scheduleGlide(); scheduleColour(); scheduleBreath(); scheduleVibrato(); }
    ramp(LEVEL, 4);
    if (debug) window.__hum = { ctx: actx, master: graph.master, graph };
  }
  function disable() {
    if (!graph) return;
    ramp(0, 2);
    tearDown = setTimeout(() => { if (!on && graph) destroy(); }, 2400);
  }

  btn.addEventListener('click', () => {
    on = !on;
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? 'Turn the hum off' : 'Turn the hum on');
    if (on) {
      enable();
      if (!hint.hidden) { remember(); hint.classList.add('fade'); setTimeout(() => { hint.hidden = true; }, 1700); }
    } else disable();
  });
  document.addEventListener('visibilitychange', () => {
    if (!graph || !on) return;
    clearTimeout(hideTimer);
    if (document.hidden) {
      ramp(0, 0.3);
      hideTimer = setTimeout(() => { if (document.hidden && graph) actx.suspend().catch(() => {}); }, 400);
    } else {
      actx.resume().then(() => { if (graph && on) ramp(LEVEL, 1.5); }).catch(() => {});
    }
  });
})();
</script>
</body>
</html>

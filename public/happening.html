<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Nothing. Something. No thing, some thing. The original beat. Became sound. Light. Form.">
<meta name="theme-color" content="#0b0a14">
<link rel="canonical" href="https://thehum.is/happening">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="The Hum is happening">

<title>The Hum</title>
<script>document.documentElement.classList.add('js'); try { if (!localStorage.getItem('hum.entered') && !localStorage.getItem('hum.heard')) document.documentElement.classList.add('entering'); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..400;1,6..72,300&display=swap" rel="stylesheet">
<style>
  /* One dark theme, on purpose. The sister page radiates; this one draws in. */
  :root {
    color-scheme: dark;
    --field: #0b0a14;
    --corner: #060510;
    --ink: #e6e2f0;
    --ink-dim: #8f87b0;
    --ring: #b48cff;
    --magenta: #ff5fb8;
    --teal: #4fd6c8;
    /* Void diameter. Wide screens: up to 560px, and never so tall that the ring meets the end mark at the
       foot (--clear: the room kept above and below it). Tall tablets: larger, up to 720px. Phones: wider
       than the screen, so the ring reads as a horizon, not a badge, still clear of the foot. */
    --clear: calc(88px + env(safe-area-inset-bottom, 0px));
    --d: clamp(280px, min(70vw, 100svh - 2 * var(--clear)), 560px);
    --inscription-size: 11px;
    --verse-size: 24px;
    --verse-lh: 1.6;
    --verse-w: min(80vw, 420px);
    --footer-h: 44px;   /* a door's tap height */
    --footer-gap: 28px;
    --door-in: 84px;   /* a door's centre, inside the rim */
    /* The reset's draw-in: the verse falls into the void, faster and faster all the way to the centre
       (ease-in cubic), fading on the same curve. It goes first; the void follows DRAWIN_LEAD later. */
    --draw-in-ease: cubic-bezier(0.32, 0, 0.67, 0);
    --draw-in-fade: var(--draw-in-ease);
    --draw-in-time: 1.1s;
    --dive-time: 1.1s;   /* leaving through a door: the script's DIVE_MS */
    --dive-ease: cubic-bezier(0.7, 0, 0.84, 0);   /* the script's DIVE_EASE (easeInExpo) */
    /* The verse, a line at a time: a line comes in over --line-in (rising out of the void a little,
       decelerating) and goes over --line-out (drawn back in, on the draw-in's ease). The script reads both. */
    --line-in: 0.7s;
    --line-out: 0.55s;
    /* The mark: the page's name, the Hum's own sign, at the void's centre. It comes in over --mark-in. */
    --mark: clamp(48px, calc(var(--d) * 0.1), 60px);
    --mark-in: 1.8s;
  }
  @media (min-width: 701px) and (orientation: portrait) {
    :root { --d: clamp(280px, min(80vw, 100svh - 2 * var(--clear)), 720px); }
  }
  /* Short and wide (a phone on its side): the end mark sits lower, so the void can keep more of the height. */
  @media (min-width: 701px) and (max-height: 500px) {
    :root {
      --footer-gap: 6px; --clear: calc(56px + env(safe-area-inset-bottom, 0px)); --verse-size: 20px;
      --d: clamp(160px, 100svh - 2 * var(--clear), 560px);
    }
  }
  @media (max-width: 700px) {
    :root {
      --d: max(280px, min(150vw, 720px, 100svh - 2 * var(--clear)));
      --inscription-size: 10px;
      --verse-size: 20px;
      --verse-lh: 1.55;
      --verse-w: 80vw;
    }
  }

  html { background: var(--corner); }
  body {
    margin: 0;
    min-height: 100svh;
    position: relative;
    color: var(--ink);
    background: var(--field);
    /* Vignette only. No other gradient belongs here. */
    background-image: radial-gradient(ellipse 80% 80% at 50% 50%, var(--field) 55%, var(--corner) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* The stage is pinned to the viewport: the void's center is the viewport's. */
  .stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  /* Flat interior. Nothing animated crosses it; the canvas only paints outside r. */
  .void {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--d);
    height: var(--d);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    /* Depth without motion: just off the field at the rim, near-black at the center. A hole that recedes. */
    background: radial-gradient(circle closest-side, #040309 0%, #06050d 45%, #0a0915 82%, #0d0b18 100%);
  }
  /* First visit: the void starts closed, a third of its size, with the name in it.
     Tapping it is the way in. Without JS, or once entered, none of this shows.
     The reset under the links plays it backwards, back to this door. */
  .door { display: none; }
  .entering .door, .opening .door { display: block; position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .entering .void { transform: translate(-50%, -50%) scale(0.3333); }
  .entering .name, .opening .name { opacity: 0; visibility: hidden; }
  .door-in {
    appearance: none; -webkit-appearance: none;
    background: none; border: 0; margin: 0; padding: 0;
    position: absolute; left: 50%; top: 50%;
    width: calc(var(--d) / 3); height: calc(var(--d) / 3);
    transform: translate(-50%, -50%); border-radius: 50%;
    display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500; font-size: var(--inscription-size);
    letter-spacing: 0.38em; text-transform: uppercase;
    color: var(--ink-dim);
    cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .door-name { display: flex; flex-direction: column; align-items: center; opacity: 0.75; transition: opacity 300ms ease; }
  .door-word { padding-left: 0.38em; }   /* balances the trailing tracking */
  .door-hint {
    margin-top: 9px;
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 300;
    font-size: 11px; letter-spacing: 0.02em; text-transform: none;
    opacity: 0.6;   /* inside the name's 0.75 */
  }
  .door-in:hover .door-name { opacity: 0.95; }
  .door-in:focus { outline: none; }
  .door-in:focus-visible .door-name {
    outline: 1px solid rgba(180,140,255,0.6); outline-offset: 5px; border-radius: 2px;
  }
  .arriving .door-in { animation: appear 1.2s ease both; }
  @keyframes appear { from { opacity: 0; } }
  /* The tap: the void opens (drawn by the canvas) and the name is pulled in as it goes, gone by the middle.
     Then the verse a line at a time at the void's centre (.on, one line at once), and after the last, the
     mark comes in where the lines were (.marked) and stays. A skip lets the line go and brings the mark. */
  @media (prefers-reduced-motion: no-preference) {
    .opening .door-in .door-name {   /* outranks :hover, which the tapping pointer is still on */
      opacity: 0; transform: scale(0.2);
      transition: all 1.2s cubic-bezier(0.55, 0, 1, 0.45);   /* falling: slow, then all at once */
    }
    .opening .door-word { letter-spacing: 0; padding-left: 0; transition: all 1.2s cubic-bezier(0.55, 0, 1, 0.45); }
    .js .verse p > span {
      transform: translateY(-50%) scale(0.97);
      transition: opacity var(--line-out) var(--draw-in-ease), transform var(--line-out) var(--draw-in-ease);
    }
    .js .verse p > span.on {
      transform: translateY(-50%);
      transition: opacity var(--line-in) ease, transform var(--line-in) cubic-bezier(0.33, 1, 0.68, 1);
    }
    .skipped .verse p > span { transition-duration: 0.4s; }
    .pacing .name {
      opacity: 0; visibility: hidden; transform: scale(0.85);
      transition: opacity 0.6s ease, transform 0.6s ease, visibility 0s linear 0.6s;
    }
    .pacing.marked .name {
      opacity: 1; visibility: visible; transform: none;
      transition: opacity calc(var(--mark-in) * 0.75) ease, transform var(--mark-in) cubic-bezier(0.33, 1, 0.68, 1), visibility 0s;
    }
    /* Backwards: the end mark goes, and the mark is drawn into the void's centre the way the name is on the
       way in (--draw-in-ease, --draw-in-time), as the void closes around it. */
    .leaving .name {
      opacity: 0; visibility: hidden; transform: scale(0.2);
      transition: transform var(--draw-in-time) var(--draw-in-ease), opacity var(--draw-in-time) var(--draw-in-fade), visibility 0s linear var(--draw-in-time);
    }
  }
  /* Reduced motion: no pull, no opening, no sequence. The door fades out; the verse comes in whole and
     still (.reading), stays for as long as the lines would have taken (or until a tap or a key), then
     gives way to the mark in one crossfade (.read-out). */
  @media (prefers-reduced-motion: reduce) {
    .opening .door { opacity: 0; transition: opacity 0.6s ease; }
    .opening .stage { transition: opacity 0.6s ease; }
    .opening.dark .stage { opacity: 0; }
    .js .verse p > span { transition: none; }
    .reading .verse { animation: appear 0.8s ease 0.3s both; }
    .reading .name { opacity: 0; visibility: hidden; }
    .read-out .verse { opacity: 0; transition: opacity 0.8s ease; }
    .name { transition: opacity 0.8s ease; }
    .leaving .name { opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0s linear 0.6s; }
    .leaving .verse { opacity: 0; transition: opacity 0.6s ease; }
    .leaving .stage, .arriving .stage { transition: opacity 0.6s ease; }
    .leaving.dark .stage { opacity: 0; }
  }

  /* Without the script the verse is a still block in the middle of the void. With it, the verse's lines
     sit stacked at the void's centre, each hidden to the eye only (still read), and are shown one at a time
     by the entrance. */
  .verse-wrap {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    box-sizing: border-box;
    padding: 84px 0 calc(84px + env(safe-area-inset-bottom, 0px));
    display: grid;
    place-items: center;
  }
  .verse {
    width: var(--verse-w);
    margin: 0;
    text-align: center;
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-weight: 340;   /* light text on the dark reads thinner than it is */
    font-size: var(--verse-size);
    line-height: var(--verse-lh);
    color: rgb(216 208 244 / 0.95);   /* the hum's own lavender, a step brighter, so the words share its light */
  }
  .verse p { margin: 0; }
  .verse p + p { margin-top: calc(var(--verse-size) * var(--verse-lh) * 1.25); }   /* a breath, not a skipped line */
  .verse p > span {
    display: block;
    text-wrap: balance;
  }
  .js .verse-wrap { position: fixed; inset: 0; min-height: 0; padding: 0; display: block; pointer-events: none; }
  .js .verse { position: absolute; left: 50%; top: 50%; height: 0; margin-left: calc(var(--verse-w) / -2); }
  .js .verse p + p { margin: 0; }
  .js .verse p > span { position: absolute; left: 0; right: 0; top: 0; transform: translateY(-50%); opacity: 0; }   /* hidden to the eye only; still read */
  .js .verse p > span.on { opacity: 1; }
  .js.reading .verse-wrap { display: grid; place-items: center; }
  .js.reading .verse { position: static; height: auto; margin: 0; }
  .js.reading .verse p + p { margin-top: calc(var(--verse-size) * var(--verse-lh) * 1.25); }
  .js.reading .verse p > span { position: static; transform: none; opacity: 1; }

  /* The mark: the Hum's sign (the favicon's ring, without its square of sky) at the void's exact centre,
     where the lines were. It is the page's name, and the way to thehum.ing: the hum, playing. Under it, in
     the ways' type, where it goes. */
  .name {
    position: fixed; inset: 0; z-index: 2; margin: 0;
    display: grid; place-items: center;
    pointer-events: none;
    font-size: inherit; font-weight: inherit;
  }
  html:not(.js) .name { display: none; }
  .mark {
    position: relative; pointer-events: auto;
    display: grid; place-items: center;
    width: calc(var(--mark) + 16px); height: calc(var(--mark) + 16px);   /* past the 44 px tap minimum at every size */
    border-radius: 50%;
    color: #b9b0da; text-decoration: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .mark svg { width: var(--mark); height: var(--mark); display: block; overflow: visible; opacity: 0.9; transition: opacity 300ms ease, filter 300ms ease; }
  .mark-way {
    position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    padding: 6px 10px 10px;   /* the caption is part of the link: a tap on it counts */
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 300;
    font-size: 14px; letter-spacing: 0.02em; white-space: nowrap;
    opacity: 0.65; transition: opacity 300ms ease, color 300ms ease;
  }
  .mark:hover svg, .mark:focus-visible svg { opacity: 1; filter: drop-shadow(0 0 6px rgba(180,140,255,0.45)); }
  .mark:hover .mark-way, .mark:focus-visible .mark-way { opacity: 1; color: var(--ink); }
  .mark:focus { outline: none; }
  .mark:focus-visible { outline: 1px solid rgba(180,140,255,0.6); outline-offset: 4px; }

  /* The ways onward: studio and works as doors on the horizon, left and right of the verse. Wide: on the
     ring's centre line, just inside its rim (--door-in). Phones, where the rim's sides are off-screen:
     near the screen's edges. They arrive with the end mark and leave first with it (below). */
  .ways a {
    position: fixed; top: 50%; z-index: 2;   /* above the verse's flow, so the doors take the tap */
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: var(--footer-h); padding: 0 12px; box-sizing: border-box;
    transform: translate(-50%, -50%);
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: 14px;
    gap: 7px;
    color: #b9b0da;   /* partway from the footer's dim toward the verse's lavender: present, not loud */
    opacity: 0.85;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: color 300ms ease, opacity 300ms ease;
  }
  /* A fine outward caret: this way out. It leans further out on hover. */
  .way-arrow {
    width: 6px; height: 10px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0.6; transition: transform 300ms ease, opacity 300ms ease;
  }
  .ways a:hover .way-arrow, .ways a:focus-visible .way-arrow { opacity: 1; }
  .ways .way-studio:hover .way-arrow, .ways .way-studio:focus-visible .way-arrow { transform: translateX(-3px); }
  .ways .way-works:hover .way-arrow, .ways .way-works:focus-visible .way-arrow { transform: translateX(3px); }
  /* The word leans out too, a little less than its mark. */
  .ways a span { display: inline-block; transition: transform 300ms ease; }
  .ways .way-studio:hover span, .ways .way-studio:focus-visible span { transform: translateX(-2px); }
  .ways .way-works:hover span, .ways .way-works:focus-visible span { transform: translateX(2px); }
  @media (prefers-reduced-motion: reduce) {
    .way-arrow { transition: none; }
    .ways a:hover .way-arrow, .ways a:focus-visible .way-arrow { transform: none; }
    .ways a span { transition: none; }
    .ways a:hover span, .ways a:focus-visible span { transform: none; }
  }
  .ways .way-studio { left: calc(50% - var(--d) / 2 + var(--door-in)); }
  .ways .way-works { left: calc(50% + var(--d) / 2 - var(--door-in)); }
  @media (min-width: 701px) and (max-height: 500px) {   /* the void too small to hold them: just outside the rim */
    .ways { --door-in: -64px; }
  }
  @media (max-width: 700px) {
    .ways .way-studio { left: calc(env(safe-area-inset-left, 0px) + 20px); transform: translateY(-50%); }
    .ways .way-works { left: auto; right: calc(env(safe-area-inset-right, 0px) + 20px); transform: translateY(-50%); }
  }
  .ways a:hover, .ways a:focus-visible {
    color: var(--ink);
    opacity: 1;
    outline: none;
  }
  .ways a:focus-visible span { outline: 1px solid rgba(180,140,255,0.6); outline-offset: 5px; border-radius: 2px; }
  /* The foot: the end mark, a small turning arrow, easy to miss. It brings the entrance back. It frames the
     page from the bottom edge, outside the ring. */
  .foot {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    padding-bottom: calc(var(--footer-gap) + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center;
    pointer-events: none;
  }
  html:not(.js) .foot { display: none; }
  .verse-reset {
    appearance: none; -webkit-appearance: none; background: none; border: 0; margin: 0; padding: 0;
    pointer-events: auto;
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim); opacity: 0.38; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: color 300ms ease, opacity 300ms ease;
  }
  .verse-reset:hover, .verse-reset:focus-visible { opacity: 0.75; }
  .verse-reset:focus { outline: none; }
  .verse-reset:focus-visible svg { outline: 1px solid rgba(180,140,255,0.6); outline-offset: 6px; border-radius: 50%; }
  .verse-reset svg { display: block; width: 10px; height: 10px; }
  /* Hidden at the door, while the entrance runs (.quiet-mark: until the mark has come in), and first to go
     on the reset. They arrive slowly (.mark-in), the last thing: the end mark, the doors, the mark's way. */
  .entering .verse-reset, .opening .verse-reset, .quiet-mark .verse-reset,
  .entering .ways a, .opening .ways a, .quiet-mark .ways a,
  .entering .mark-way, .opening .mark-way, .quiet-mark .mark-way { visibility: hidden; opacity: 0; }
  .mark-in .mark-way { transition: opacity 1.5s ease; }
  .leaving .mark-way { visibility: hidden; opacity: 0; transition: opacity 0.25s ease, visibility 0s linear 0.25s; }
  .leaving .verse-reset { visibility: hidden; opacity: 0; transition: opacity 0.25s ease, visibility 0s linear 0.25s; }
  /* On the reset the doors fall in with the verse: drawn toward the centre, shrinking and fading, on its ease. */
  .ways { --inward: calc(var(--d) / 2 - var(--door-in)); }
  .leaving .ways a {
    visibility: hidden; opacity: 0;
    transition: transform var(--draw-in-time) var(--draw-in-ease), opacity var(--draw-in-time) var(--draw-in-fade),
      visibility 0s linear var(--draw-in-time);
  }
  .leaving .ways .way-studio { transform: translate(calc(-50% + var(--inward)), -50%) scale(0.2); }
  .leaving .ways .way-works { transform: translate(calc(-50% - var(--inward)), -50%) scale(0.2); }
  @media (max-width: 700px) {
    .ways { --inward: calc(50vw - 64px); }
    .leaving .ways .way-studio { transform: translate(var(--inward), -50%) scale(0.2); }
    .leaving .ways .way-works { transform: translate(calc(-1 * var(--inward)), -50%) scale(0.2); }
  }
  .mark-in .verse-reset, .mark-in .ways a { transition: opacity 1.5s ease; }
  /* Leaving through a door: the verse is drawn inward on the draw-in's ease, the doors fly outward,
     the name and the end mark fade, over --dive-time (the script's DIVE_MS) while the void opens past the
     screen. Reduced motion: a quick fade to dark. */
  .diving .verse-wrap {
    opacity: 0; transform: scale(0.2); transform-origin: 50% 50vh;
    transition: transform var(--dive-time) var(--dive-ease), opacity var(--dive-time) var(--draw-in-fade);
  }
  .diving .mark:not(.chosen), .diving .verse-reset { opacity: 0; transition: opacity calc(var(--dive-time) * 0.6) ease; }
  /* Taken, the mark leaves as a door does: it brightens at once, holds, and swells as it fades through the
     dive, as if the void it stands for were opening too. */
  .diving .mark.chosen { animation: chosen var(--dive-time) linear both; transform: scale(2.4); transition: transform var(--dive-time) var(--dive-ease); }
  .diving .mark.chosen svg { opacity: 1; filter: drop-shadow(0 0 8px rgba(180,140,255,0.6)); }
  .diving .mark.chosen .mark-way { opacity: 0; transition: opacity 0.25s ease-out; }
  .ways { --outward: 45vw; }
  .diving .ways a {
    opacity: 0;
    transition: transform var(--dive-time) var(--dive-ease), opacity var(--dive-time) var(--draw-in-fade);
  }
  .diving .ways .way-studio { transform: translate(calc(-50% - var(--outward)), -50%) scale(1.6); }
  .diving .ways .way-works { transform: translate(calc(-50% + var(--outward)), -50%) scale(1.6); }
  /* The click answers at once, under the dive: the chosen door snaps bright (--chosen-snap) and holds a
     moment before it fades on the way out, its caret jumping out (--chosen-jump); the other door goes
     quickly (--other-fade). */
  .ways { --chosen-snap: 0.1s; --chosen-jump: 6px; --other-fade: 0.25s; }
  .diving .ways a.chosen {
    color: var(--ink);
    animation: chosen var(--dive-time) linear both;
    transition: transform var(--dive-time) var(--dive-ease), color var(--chosen-snap) ease-out;
  }
  @keyframes chosen { 0% { opacity: 0.85; } 9% { opacity: 1; } 55% { opacity: 0.9; } 100% { opacity: 0; } }
  .diving .ways a.chosen .way-arrow { opacity: 1; transition: transform var(--chosen-snap) ease-out, opacity var(--chosen-snap) ease-out; }
  .diving .ways .way-studio.chosen .way-arrow { transform: translateX(calc(-1 * var(--chosen-jump))); }
  .diving .ways .way-works.chosen .way-arrow { transform: translateX(var(--chosen-jump)); }
  .diving .ways a:not(.chosen) { transition: transform var(--dive-time) var(--dive-ease), opacity var(--other-fade) ease-out; }
  @media (max-width: 700px) {
    .diving .ways .way-studio { transform: translate(calc(-1 * var(--outward)), -50%) scale(1.6); }
    .diving .ways .way-works { transform: translate(var(--outward), -50%) scale(1.6); }
  }
  @media (prefers-reduced-motion: reduce) {
    .diving .verse-wrap, .diving .mark, .diving .verse-reset, .diving .ways a { transform: none; transition: opacity 0.3s ease; }
    .diving .ways a.chosen { animation: none; opacity: 1; transition: none; }   /* an instant brightening, no jump */
    .diving .mark.chosen { animation: none; opacity: 1; transform: none; }
    .diving .ways .way-studio.chosen .way-arrow, .diving .ways .way-works.chosen .way-arrow { transform: none; transition: none; }
    @media (min-width: 701px) { .diving .ways .way-studio, .diving .ways .way-works { transform: translate(-50%, -50%); } }
    @media (max-width: 700px) { .diving .ways .way-studio, .diving .ways .way-works { transform: translateY(-50%); } }
    .diving .stage { transition: opacity 0.3s ease; }
    .diving.dark .stage { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ways a, .mark-in .ways a, .leaving .ways a { transition: none; }
    .leaving .ways .way-studio, .leaving .ways .way-works { transform: none; }
    @media (min-width: 701px) { .leaving .ways .way-studio, .leaving .ways .way-works { transform: translate(-50%, -50%); } }
    @media (max-width: 700px) { .leaving .ways .way-studio, .leaving .ways .way-works { transform: translateY(-50%); } }
  }
  /* After the tap that enters, the mouse pointer goes quiet until it moves. */
  html.cursor-hidden, html.cursor-hidden * { cursor: none !important; }
</style>
</head>

<main class="verse-wrap">

    <p>
      <span><span>Nothing.</span></span>
      <span><span>Something.</span></span>
      <span><span>No thing, some thing.</span></span>
      <span><span>The original beat.</span></span>
      <span><span>Became sound.</span></span>
      <span><span>Light.</span></span>
      <span><span>Form.</span></span>
    </p>
    <p>
      <span><span>Everything is this.</span></span>
      <span><span>Still enough to hear</span></span>
      <span><span>that it becomes</span></span>
      <span><span>through us.</span></span>
    </p>
  </div>
</main>

<nav class="ways" aria-label="Onward">

  <a class="way-works" href="https://thehum.works" aria-label="thehum.works"><span>works</span><svg class="way-arrow" viewBox="0 0 6 10" aria-hidden="true"><path d="M1 1l4 4-4 4"/></svg></a>
</nav>

<h1 class="name">

    <defs>

      <linearGradient id="mark-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b48cff"/><stop offset=".25" stop-color="#ca7eea"/><stop offset=".5" stop-color="#b48cff"/><stop offset=".8" stop-color="#96a2ef"/><stop offset="1" stop-color="#b48cff"/></linearGradient>
    </defs>
    <circle cx="32" cy="32" r="31" fill="url(#mark-glow)"/>
    <circle cx="32" cy="32" r="20.5" fill="#040309"/>
    <circle cx="32" cy="32" r="20.5" fill="none" stroke="url(#mark-ring)" stroke-width="2"/>
  </svg><span class="mark-way" aria-hidden="true">thehum.ing</span></a>

<footer class="foot">
  <button type="button" class="verse-reset" aria-label="See the entrance again"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.2 1.6v2.8H9.4"/></svg></button>
